<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Knowledge Base</title>
    <link rel="stylesheet" href="styles.css?v=20261101-unified1">
    <link rel="stylesheet" href="/3dworkbench/pluginWorkspace.css?v=20261101-unified1">
    <link rel="stylesheet" href="/3dworkbench/components/applicationLauncher.css?v=20261101-unified1" data-wb-application-launcher>
  </head>
  <body>
    <div id="app" class="app-shell wb-bsp-shell">
      <header class="topbar">
        <div class="topbar-primary">
          <div class="wb-launcher-mount" data-application-launcher></div>
          <div class="toolbar">
            <button id="theme-toggle" class="icon-button" data-icon="moon" type="button" title="切换日间/夜间" aria-label="切换日间/夜间">夜间</button>
            <button id="refresh" class="primary icon-button" data-icon="refresh" type="button" title="刷新" aria-label="刷新">刷新</button>
          </div>
        </div>
      </header>
      <main id="workbench" class="wb-workbench"></main>
    </div>
    <section id="load-state" class="load-state" role="status" aria-live="polite">
      <div class="load-state-card"><strong id="load-state-title">正在载入工作台</strong><span id="load-state-detail">准备读取本地 SQLite 索引</span><div class="load-progress"><i id="load-progress-value"></i></div><button id="retry-load" type="button" hidden>重试</button></div>
    </section>
    <script type="module" src="app.js?v=20261101-unified1"></script>
  </body>
</html>
